<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccolta Poggioreale</title>

    <!-- Bootstrap 5.3.0 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Icone Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Includi jQuery dal CDN di Google o jQuery direttamente -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!-- Tagify per le categorie -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.min.js"></script>

    <!-- Esportazione in pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- TinyMCE CDN con chiave API -->
    <script src="https://cdn.tiny.cloud/1/qiioujnk3j9gh78onhkaow1crywy6hpsqbvxybga6snaco41/tinymce/6/tinymce.min.js"
        referrerpolicy="origin"></script>

    <!-- Main script -->
    <script src="main.js" type="module"></script>

    <!-- File manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc3545">
    <link rel="apple-touch-icon" href="resources/icons/icon-192.png">

</head>

<body>
    <div class="container mt-4">
        <!-- Autenticazione -->
        <div class="d-flex flex-row-reverse col-12">
            <button id="open-auth" class="btn btn-warning">
                <i class="fa fa-lock"></i>
            </button>
        </div>
        <!-- Intestazione -->
        <div class="row align-items-center">
            <div class="col-12">
                <h1 class="text-center">Raccolta Poggioreale</h1>
            </div>
        </div>

        <!-- Segmented Button -->
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-center">
                <div class="btn-group" id="raccolte-btnGroup" role="group" aria-label="Segmented Button">
                    <button type="button" class="btn btn-custom active">-</button>
                </div>
            </div>
        </div>

        <!-- Switch per la sincronizzazione -->
        <div class="d-flex flex-row-reverse mb-4 pe-3">
            <div class="form-check form-switch d-inline-flex align-items-center p-0">
                <label class="form-check-label mb-0 me-5 pe-3" for="syncSwitch">
                    <span id="syncText">Live Sync Attiva</span>
                    <i id="syncIcon" class="bi bi-cloud ms-2"></i>
                </label>
                <input type="checkbox" class="form-check-input custom-switch" id="syncSwitch" checked
                    onclick="toggleSync()">
            </div>
        </div>

        <!-- Pulsante PDF -->
        <div class="row d-flex justify-content-between mb-3">
            <div class="col-md-6">
                <button onclick="exportToPDF()" class="btn btn-outline-danger me-0 mb-0" id="exportSongs">
                    <i class="fa fa-file-pdf"></i> Esporta PDF
                </button>
            </div>
        </div>

        <!-- Autenticazione -->
        <div id="auth" class="row mt-4">
            <div class="col-12">
                <!-- Elementi di autenticazione -->
            </div>
        </div>

        <!-- Raccolta -->
        <div id="raccolta">
            <!-- Pulsanti -->
            <div class="admin">
                <div class="d-flex justify-content-between mb-3">
                    <!-- Tasto per aprire l'indice -->
                    <button id="open-index" class="btn btn-secondary">
                        <i class="fa fa-list"></i> Indice
                    </button>
                    <!-- Tasto nuovo brano -->
                    <button onclick="window.location.href='addSong.html'" class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i> Nuovo brano
                    </button>
                </div>
            </div>
            <!-- Barra di ricerca -->
            <div class="admin">
                <div class="input-group mb-3" id="searchBarRaccolta">
                    <input type="text" id="search-bar" class="form-control"
                        placeholder="Cerca per numero, titolo o categoria...">
                    <button class="btn btn-outline-secondary mb-0 pb-0 pt-0" type="button"
                        onclick="clearSearchBar()">Cancella</button>
                </div>
                <!-- Checkbox per attivare la ricerca per parole contenute -->
                <input class="form-check-input" type="checkbox" value="" id="wordSearch"
                    style="width: 30px; height: 30px; margin-top: 0px;">
                <label class="form-check-label" for="wordSearch">
                    Ricerca per parole contenute
                </label>
            </div>

            <!-- Raccolta -->
            <div id="songs-list" class="mt-4"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
</body>

</html>
