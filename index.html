<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccolta Poggioreale</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Stile Toastify -->
    <link rel="stylesheet" href="https://apvarun.github.io/toastify-js/src/toastify.css">

    <!-- Includi il file JavaScript di Toastify -->
    <script src="tostify/script.min.js"></script>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

    <!-- Esportazione in pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


    <!-- TinyMCE CDN con chiave API -->
    <script src="https://cdn.tiny.cloud/1/qiioujnk3j9gh78onhkaow1crywy6hpsqbvxybga6snaco41/tinymce/6/tinymce.min.js"
        referrerpolicy="origin"></script>

    <!-- Firebase SDK -->
    <script src="main.js" type="module"></script>

</head>

<body>

    <div class="container mt-6">
        <div class="d-flex d-flex justify-content-center">
            <div class="col-md-1 p-0" id="auth"></div>
            <h1 class="mt-2 col-md-8">Raccolta Poggioreale</h1>
            <!-- Tasto per autenticazione -->
            <button id="open-auth" class="btn btn-warning col-md-1">
                <i class="fa fa-lock"></i>
            </button>
        </div>
        <!-- Segmented Button -->
        <div class="admin">
            <div class="d-flex justify-content-center">
                <div class="btn-group" role="group" aria-label="Segmented Button">
                    <button type="button" class="btn btn-custom active mr-0 mb-0" id="raccolta-btn">Raccolta</button>
                    <button type="button" class="btn btn-custom mr-0 mb-0" id="inni-btn">Inni di Lode</button>
                </div>
            </div>
        </div>
        <button onclick="exportToPDF()" class="btn btn-outline-danger mt-3 mb-0">
            <i class="fa fa-file-pdf"></i> Esporta PDF
        </button>
        <div id="raccolta" class="mt-4">
            <!-- Pulsanti -->
            <div class="admin">
                <div class="d-flex justify-content-between mb-3">
                    <!-- Tasto per aprire l'indice -->
                    <button id="open-index" class="btn btn-secondary">
                        <i class="fa fa-list"></i> Indice
                    </button>
                    <!-- Tasto nuovo cantico -->
                    <button onclick="window.location.href='editor.html'" class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i> Nuovo cantico
                    </button>
                </div>
            </div>
            <!-- Barra di ricerca -->
            <div class="admin">
                <div class="input-group mb-3" id="searchBarRaccolta">
                    <input type="text" id="search-bar" class="form-control"
                        placeholder="Cerca per numero, titolo o categoria...">
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary mb-0 pb-0 pt-0" type="button"
                            onclick="clearSearchBar()">Cancella</button>
                    </div>
                </div>
                <!-- Checkbox per attivare la ricerca per parole contenute -->
                <div class="form-check form-switch mt-2 d-flex align-items-center" style="font-size: 1.25rem;">
                    <input type="checkbox" class="form-check-input" id="wordSearch" style="width: 30px; height: 30px">
                    <label class="form-check-label ml-3" for="wordSearch">Ricerca per parole contenute</label>
                </div>
            </div>

            <!-- Raccolta -->
            <div id="songs-list" class="mt-4"></div>
        </div>
        <div id="inni" style="display: none;">
            <!-- Tasti di navigazione del PDF -->
            <div class="admin">
                <div class="pdf-controls d-flex justify-content-center align-items-center mb-3 mt-3">
                    <button id="prev-page" class="btn btn-secondary mr-3 mb-0 ml-0">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span>Pagina: <span id="page-num"></span> / <span id="page-count"></span></span>
                    <button id="next-page" class="btn btn-secondary ml-3 mb-0 mr-0">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <!-- Barra di ricerca per il PDF -->
                <div class="input-group mb-3">
                    <input type="text" id="pdf-search-bar" class="form-control" placeholder="Cerca nel PDF...">
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary mb-0 pb-0 pt-0" type="button"
                            onclick="clearSearchPDF()">Cancella</button>
                    </div>
                </div>
            </div>
            <!-- Inni di lode -->
            <canvas id="pdf-render" style="border: 1px solid black; width: 100%;"></canvas>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
</body>

</html>
