<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccolta Poggioreale | Aggiungi brano</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Tagify per le categorie -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.min.js"></script>

    <!-- Firebase SDK -->
    <script src="js/addSong.js" type="module"></script>

    <!-- Metronomo -->
    <script type="module">
        import {
            toggleMetronomeInAdding,
            refreshMetronomeParamsInAdding,
            stopMetronomeInAdding
        } from '/js/metronome.js';

        window.toggleMetronomeInAdding = toggleMetronomeInAdding;
        window.refreshMetronomeParamsInAdding = refreshMetronomeParamsInAdding;
        window.stopMetronomeInAdding = stopMetronomeInAdding;
    </script>
</head>

<body>
    <div class="container mt-4" style="user-select: none;">
        <h1>Inserisci un nuovo brano</h1>
        <!-- Seleziona una delle raccolte o creane una nuova -->
        <div class="form-group">
            <label for="song-collection">Seleziona una raccolta:</label>
            <select id="song-collection" class="form-control">
                <option value="" selected disabled>Seleziona una raccolta</option>
                <option value="new">Crea nuova raccolta</option>
            </select>
        </div>
        <!-- Selezione della categoria del brano -->
        <div class="form-group">
            <label for="song-categories">Categorie:</label>
            <input type="text" id="song-categories" class="form-control"
                placeholder="Inserisci le categorie con la virgola, tab o invio">
        </div>
        <!-- Tempo e BPM -->
        <div class="d-flex">
            <div class="form-group mr-2">
                <label for="tempo">Tempo:</label>
                <select id="tempo" class="form-control">
                    <option value="2/4">2/4</option>
                    <option value="3/4">3/4</option>
                    <option value="4/4" selected>4/4</option>
                    <option value="6/8">6/8</option>
                </select>
            </div>
            <div class="form-group mr-2">
                <label for="bpm">BPM:</label>
                <input id="bpm" class="form-control" type="number" min="40" max="300" placeholder="Inserisci BPM">
            </div>
            <div class="form-group mt-4 mb-0">
                <button class="btn btn-outline-primary ms-4 mb-0 mt-1" onclick="toggleMetronomeInAdding({ btn: this })"
                    id="metronome-btn">
                    ▶️ Metronomo
                </button>
            </div>
        </div>
        <!-- Numero e titolo (facoltativi) -->
        <div class="d-flex col-12 mb-2 pr-2 pl-0">
            <input id="numero" class="form-control col-md-2 mr-2" type="number" min="1" placeholder="N."
                style="font-size:12px">
            <input id="titolo" class="form-control col-10" type="text" placeholder="Titolo" style="font-size:12px">
        </div>
        <!-- Controlli per la trasposizione -->
        <div class="col-12 mb-2">
            <small class="form-text text-muted">
                <i>Gli accordi devono essere in maiuscolo e compresi tra caratteri pipe </i>'|'<i><br>
                    Esempio: </i>|LAm7| |DO| |RE4|
            </small>
        </div>
        <div class="col-12">
            <label for="transpose-down" class="mr-2">Trasposizione:</label>
            <button id="transpose-down2" class="btn btn-outline-secondary btn-sm mr-2"
                style="padding-right: 20px;padding-left: 20px;">-2</button>
            <button id="transpose-down" class="btn btn-outline-secondary btn-sm mr-2"
                style="padding-right: 20px;padding-left: 20px;">-1</button>
            <span id="transpose-value">0</span>
            <button id="transpose-up" class="btn btn-outline-secondary btn-sm ml-2"
                style="padding-right: 20px;padding-left: 20px;">+1</button>
            <button id="transpose-up2" class="btn btn-outline-secondary btn-sm ml-2"
                style="padding-right: 20px;padding-left: 20px;">+2</button>
        </div>
        <!-- TOOLBAR -->
        <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
            <div class="btn-group me-2" role="group">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-cmd="bold"><b>B</b></button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-cmd="italic"><i>I</i></button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-cmd="underline"><u>U</u></button>
            </div>

            <div class="d-flex align-items-center me-2">
                <label class="me-1 mb-0 small mr-1">Dimensione</label>
                <select class="form-select form-select-sm" style="width:auto" data-role="font-size">
                    <option value="8px">8</option>
                    <option value="12px">12</option>
                    <option value="14px" selected>14</option>
                    <option value="16px">16</option>
                    <option value="18px">18</option>
                    <option value="20px">20</option>
                    <option value="24px">24</option>
                </select>
            </div>

            <div class="d-flex align-items-center">
                <label class="me-1 mb-0 small mr-1 me-1 col-7">Colore</label>
                <input type="color" class="form-control form-control-color form-control-sm col-5" value="#000000"
                    data-role="font-color">
            </div>
        </div>
        <!-- Editor di testo -->
        <div id="song-editor" contenteditable="true" class="form-control"
            style="height: 300px; overflow-y: auto; border: 1px solid #ced4da; padding: 10px;"
            placeholder="Inserisci testo e accordi qui"></div>
        <div class="d-flex flex-row-reverse">
            <button id="save-song" class="btn btn-success mt-2">Salva</button>
            <button onclick="window.location.href='/'" class="btn btn-secondary mt-2">Torna alla Pagina
                Principale</button>
        </div>
    </div>

    <!-- Includi jQuery e SweetAlert -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
</body>

</html>
