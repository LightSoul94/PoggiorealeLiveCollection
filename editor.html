<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccolta Poggioreale | Aggiungi cantico</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- TinyMCE CDN con chiave API -->
    <script src="https://cdn.tiny.cloud/1/qiioujnk3j9gh78onhkaow1crywy6hpsqbvxybga6snaco41/tinymce/6/tinymce.min.js"
        referrerpolicy="origin"></script>

    <!-- Firebase SDK -->
    <script src="editor.js" type="module"></script>
</head>

<body>
    <div class="container mt-4">
        <h1>Inserisci un nuovo cantico</h1>
        <!-- Controlli per la trasposizione -->
        <div class="d-flex align-items-center mb-3">
            <label for="transpose-controls" class="mr-2">Trasposizione:</label>
            <button id="transpose-down" class="btn btn-outline-secondary btn-sm mr-2">-</button>
            <span id="transpose-value">0</span>
            <button id="transpose-up" class="btn btn-outline-secondary btn-sm ml-2">+</button>
        </div>
        <!-- Selezione della categoria del cantico -->
        <div class="form-group">
            <label for="song-category">Categoria:</label>
            <select id="song-category" class="form-control">
                <option value="Generico">Generico</option>
                <option value="Apertura">Apertura</option>
                <option value="Preghiera">Preghiera</option>
                <option value="Lode">Lode</option>
                <option value="Chiusura">Chiusura</option>
                <option value="Piccolo">Piccolo</option>
                <option value="Da Verificare">Da Verificare</option>
            </select>
        </div>
        <!-- Numero e titolo (facoltativi) -->
        <div class="d-flex col-12 mb-2 pr-2 pl-0">
            <input id="numero" class="form-control col-md-2 mr-2" type="number" min="0" placeholder="N." style="font-size:12px">
            <input id="titolo" class="form-control col-10" type="text" placeholder="Titolo" style="font-size:12px">
        </div>
        <!-- Editor di testo -->
        <div id="song-editor" contenteditable="true" class="form-control"
            style="height: 300px; overflow-y: auto; border: 1px solid #ced4da; padding: 10px;"
            placeholder="Inserisci testo e accordi qui..."></div>
        <div class="d-flex flex-row-reverse">
            <button id="save-song" class="btn btn-success mt-2">Salva</button>
            <button onclick="window.location.href='index.html'" class="btn btn-secondary mt-2">Torna alla Pagina
                Principale</button>
        </div>
    </div>

    <!-- Includi jQuery e SweetAlert -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
</body>

</html>
