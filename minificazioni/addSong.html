<!doctype html><html lang=it><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Raccolta Poggioreale | Aggiungi brano</title><link rel=stylesheet href=https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css><link rel=stylesheet href=style.min.css><link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css><link rel=stylesheet href=https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css><script src=https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.min.js></script><script src=https://cdn.tiny.cloud/1/qiioujnk3j9gh78onhkaow1crywy6hpsqbvxybga6snaco41/tinymce/6/tinymce.min.js referrerpolicy=origin></script><script src=addSong.min.js type=module></script></head><body><div class="container mt-4" style=user-select:none><h1>Inserisci un nuovo brano</h1><div class=form-group><label for=song-collection>Seleziona una raccolta:</label><select id=song-collection class=form-control><option value="" selected disabled>Seleziona una raccolta</option><option value=new>Crea nuova raccolta</option></select></div><div class=form-group><label for=song-categories>Categorie:</label><input id=song-categories class=form-control placeholder="Inserisci le categorie con la virgola, tab o invio"></div><div class=d-flex><div class="form-group mr-2"><label for=tempo>Tempo:</label><select id=tempo class=form-control><option value="" selected disabled>Seleziona il tempo</option><option value=2/4>2/4</option><option value=3/4>3/4</option><option value=4/4>4/4</option><option value=6/8>6/8</option></select></div><div class=form-group><label for=bpm>BPM:</label><input id=bpm class=form-control type=number min=40 max=300 placeholder="Inserisci BPM"></div></div><div class="d-flex col-12 mb-2 pr-2 pl-0"><input id=numero class="form-control col-md-2 mr-2" type=number min=1 placeholder=N. style=font-size:12px><input id=titolo class="form-control col-10" placeholder=Titolo style=font-size:12px></div><div class="col-12 mb-2"><small class="form-text text-muted"><i>Gli accordi devono essere in maiuscolo e compresi tra caratteri pipe </i>'|'<i><br>Esempio: </i>|LAm7| |DO| |RE4|</small></div><div class=col-12><label for=transpose-down class=mr-2>Trasposizione:</label><button id=transpose-down2 class="btn btn-outline-secondary btn-sm mr-2" style=padding-right:20px;padding-left:20px>-2</button><button id=transpose-down class="btn btn-outline-secondary btn-sm mr-2" style=padding-right:20px;padding-left:20px>-1</button><span id=transpose-value>0</span><button id=transpose-up class="btn btn-outline-secondary btn-sm ml-2" style=padding-right:20px;padding-left:20px>+1</button><button id=transpose-up2 class="btn btn-outline-secondary btn-sm ml-2" style=padding-right:20px;padding-left:20px>+2</button></div><div id=song-editor contenteditable=true class=form-control style="height:300px;overflow-y:auto;border:1px solid #ced4da;padding:10px" placeholder="Inserisci testo e accordi qui"></div><div class="d-flex flex-row-reverse"><button id=save-song class="btn btn-success mt-2">Salva</button><button onclick='window.location.href="/"' class="btn btn-secondary mt-2">Torna alla Pagina Principale</button></div></div><script src=https://code.jquery.com/jquery-3.5.1.min.js></script><script src=https://cdn.jsdelivr.net/npm/sweetalert2@10></script></body></html>
